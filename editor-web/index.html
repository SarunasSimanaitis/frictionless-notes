<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frictionless Notes Editor</title>
    <style>
      html,
      body,
      #root {
        box-sizing: border-box;
        min-height: 100%;
        margin: 0;
        padding: 0;
      }

      #root > div:nth-of-type(1) {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
      }

      #root > div.dynamic-height {
        height: unset;
      }

      #root div .ProseMirror {
        min-height: 100%;
        overflow: visible;
      }

      #root div.dynamic-height .ProseMirror {
        height: auto;
        min-height: 0;
        display: flow-root;
      }

      .ProseMirror:focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
